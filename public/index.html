<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartHub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0f172a;
    color:white;
}

.container{
    width:95%;
    max-width:1200px;
    margin:auto;
    padding:30px;
}

h1{
    margin-bottom:25px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:#1e293b;
    border-radius:15px;
    padding:20px;
}

.card h2{
    color:#94a3b8;
    font-size:18px;
}

.card p{
    margin-top:10px;
    font-size:32px;
    font-weight:bold;
}

.formulario{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    margin-bottom:30px;
}

.formulario h2{
    margin-bottom:20px;
}

input,select{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
    background:#334155;
    color:white;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

.movimientos{
    display:grid;
    gap:15px;
}

.movimiento{
    background:#1e293b;
    padding:15px;
    border-radius:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.ingreso{
    border-left:6px solid #22c55e;
}

.gasto{
    border-left:6px solid #ef4444;
}

.info h3{
    margin-bottom:5px;
}

.info span{
    color:#94a3b8;
    font-size:14px;
}

.importe{
    font-size:22px;
    font-weight:bold;
}

.eliminar{
    background:#dc2626;
    width:auto;
    padding:10px 15px;
    margin-left:20px;
}
</style>

</head>
<body>

<div class="container">

<h1>💰 SmartHub</h1>

<div class="cards">

<div class="card">
<h2>Saldo</h2>
<p id="saldo">0 €</p>
</div>

<div class="card">
<h2>Ingresos</h2>
<p id="ingresos">0 €</p>
</div>

<div class="card">
<h2>Gastos</h2>
<p id="gastos">0 €</p>
</div>

</div>

<div class="formulario">

<h2>Nuevo movimiento</h2>

<select id="tipo">
<option value="ingreso">Ingreso</option>
<option value="gasto">Gasto</option>
</select>

<input type="text" id="concepto" placeholder="Concepto">

<input type="number" id="importe" placeholder="Importe">

<input type="date" id="fecha">

<button onclick="guardar()">Guardar</button>

</div>

<h2 style="margin-bottom:20px;">Movimientos</h2>

<div class="movimientos" id="lista"></div>

</div>

<script>

const saldo=document.getElementById("saldo");
const ingresos=document.getElementById("ingresos");
const gastos=document.getElementById("gastos");
const lista=document.getElementById("lista");

async function cargarDashboard(){

const res=await fetch("/api/dashboard");

const data=await res.json();

saldo.innerHTML=data.saldo.toFixed(2)+" €";
ingresos.innerHTML=data.ingresos.toFixed(2)+" €";
gastos.innerHTML=data.gastos.toFixed(2)+" €";

}

async function cargarMovimientos(){

const res=await fetch("/api/movimientos");

const movimientos=await res.json();

lista.innerHTML="";

movimientos.forEach(m=>{

lista.innerHTML+=`

<div class="movimiento ${m.tipo}">

<div class="info">

<h3>${m.concepto}</h3>

<span>${m.fecha}</span>

</div>

<div style="display:flex;align-items:center;">

<div class="importe">

${m.tipo=="gasto"?"-":"+"}${Number(m.importe).toFixed(2)} €

</div>

<button class="eliminar" onclick="eliminar(${m.id})">

Eliminar

</button>

</div>

</div>

`;

});

}

async function guardar(){

const tipo=document.getElementById("tipo").value;

const concepto=document.getElementById("concepto").value;

const importe=document.getElementById("importe").value;

const fecha=document.getElementById("fecha").value;

if(concepto==""||importe==""||fecha==""){

alert("Completa todos los campos");

return;

}

await fetch("/api/movimientos",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

tipo,

concepto,

importe,

fecha

})

});

document.getElementById("concepto").value="";

document.getElementById("importe").value="";

cargarDashboard();

cargarMovimientos();

}

async function eliminar(id){

await fetch("/api/movimientos/"+id,{

method:"DELETE"

});

cargarDashboard();

cargarMovimientos();

}

cargarDashboard();

cargarMovimientos();

</script>

</body>
</html>
